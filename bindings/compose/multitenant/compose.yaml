name: nightscout-multitenant-demo

x-app: &app
  image: ${NS_DEMO_IMAGE:-nightscout-multitenant-demo:local}
  build:
    context: ../..
    dockerfile: deploy/multitenant/Dockerfile
    args:
      NS_SOURCE_COMMIT: ${NS_SOURCE_COMMIT:?Run prepare.js first}
      NS_DEPLOY_COMMIT: ${NS_DEPLOY_COMMIT:-}
  init: true
  # One-shot steps (bootstrap, primer, demo) never restart. Serving roles set
  # restart: ${NS_COMPOSE_RESTART:-on-failure} (decision compose-restart-on-failure);
  # tests that inject failures or hold a role down set NS_COMPOSE_RESTART=no.
  restart: "no"
  environment: &app-env
    NODE_EXTRA_CA_CERTS: /run/ns-ca/ca.crt
    NS_M7_DIAGNOSTICS: ${NS_M7_DIAGNOSTICS:-0}
    NS_M7_DIAGNOSTICS_INTERVAL_MS: ${NS_M7_DIAGNOSTICS_INTERVAL_MS:-5000}
    # Opt-in sampled clinical stage records (core lib/diagnostics/clinical-stages.js);
    # empty is off. A fraction in (0,1] selects the same tenants in every role.
    NS_CLINICAL_STAGE_TRACE: ${NS_CLINICAL_STAGE_TRACE:-}
  networks: [backend]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp:mode=1777]

x-serving-env: &serving-env
  <<: *app-env
  NS_API_INTERNAL_SOCKET: /run/ns-ipc/api.sock
  NS_REALTIME_INTERNAL_SOCKET: /run/ns-ipc/realtime.sock
  NS_EVALUATOR_INTERNAL_SOCKET: /run/ns-ipc/evaluator.sock
  NS_TENANT_ADMIN_INTERNAL_SOCKET: /run/ns-ipc/tenant-admin.sock

services:
  postgres:
    image: ${NS_POSTGRES_IMAGE:-nightscout-pgstream-postgres:local}
    build:
      context: .
      dockerfile: Dockerfile.postgres
    # max_connections/reserved_connections: clinical roles (evaluator, realtime and their
    # consumers) may use the reserved slots; REST-serving roles may not (clinical-isolation.js).
    command: [postgres, -c, "max_connections=${NS_POSTGRES_MAX_CONNECTIONS:-140}", -c, "reserved_connections=${NS_POSTGRES_CLINICAL_RESERVED_CONNECTIONS:-40}"]
    environment:
      POSTGRES_DB: nightscout_compose_test
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${NS_DEMO_STATE:?Run prepare.js first}/bootstrap/postgres-password:/run/secrets/postgres-password:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d postgres]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [backend]

  vault:
    image: hashicorp/vault@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    command: [vault, server, -config=/vault/config/demo.hcl]
    volumes:
      - vault-data:/vault/file
      - vault-logs:/vault/logs
      - ${NS_DEMO_STATE}/tls/server.crt:/run/ns-tls/server.crt:ro
      - ${NS_DEMO_STATE}/tls/server.key:/run/ns-tls/server.key:ro
      - ${NS_DEMO_STATE}/tls/ca.crt:/run/ns-ca/ca.crt:ro
      - ${NS_DEMO_STATE}/vault/demo.hcl:/vault/config/demo.hcl:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          export VAULT_ADDR=https://vault:8200 VAULT_CACERT=/run/ns-ca/ca.crt VAULT_MAX_RETRIES=0
          vault read sys/health uninitcode=200 >/dev/null 2>&1 && exit 0
          if [ "$$(vault read -field=initialized sys/init)" = true ] &&
             [ "$$(vault read -field=sealed sys/seal-status)" = true ]; then echo VAULT_SEALED; fi
          exit 1
      interval: 2s
      timeout: 2s
      retries: 1
      # A restored Vault starts sealed until bootstrap can reach both stores.
      start_period: 90s
    networks: [backend]

  # One-shot provisioning, part of every `up` (decision provisioning-secrets-in). It renders the role
  # documents from the credentials prepare.js seeded, then creates the PostgreSQL roles, schemas and
  # Vault tokens from the same credentials. Every role waits for it to complete; a repeat `up` renders
  # again and finds the database already provisioned.
  bootstrap:
    <<: *app
    user: "1000:1000"
    command: [sh, -c, "node deploy/multitenant/render.js && exec node deploy/multitenant/bootstrap.js"]
    depends_on:
      postgres: {condition: service_healthy}
      vault: {condition: service_started}
    environment:
      NODE_EXTRA_CA_CERTS: /run/ns-ca/ca.crt
      VAULT_ADDR: https://vault:8200
      NS_COMPOSE_BOOTSTRAP: "1"
      NS_SOURCE_COMMIT: ${NS_SOURCE_COMMIT:?Run prepare.js first}
      NS_DEPLOY_COMMIT: ${NS_DEPLOY_COMMIT:?Run prepare.js first}
      # Fixed service instances; maintenance still addresses every exact instance.
      NS_API_REPLICAS: ${NS_API_REPLICAS:-1}
      # Opt-in bounded REST admission per api process (clinical-isolation.js; empty = no limit).
      NS_API_REST_CONCURRENCY: ${NS_API_REST_CONCURRENCY:-}
      NS_API_REST_QUEUE: ${NS_API_REST_QUEUE:-}
      NS_API_REST_QUEUE_TIMEOUT_MS: ${NS_API_REST_QUEUE_TIMEOUT_MS:-}
      NS_API_REST_RETRY_AFTER_SECONDS: ${NS_API_REST_RETRY_AFTER_SECONDS:-}
      NS_CREDENTIALS_DIR: /run/ns-credentials
      NS_RENDER_OUTPUT: /state
      NS_BOOTSTRAP_OUTPUT: /state
      NS_POSTGRES_HOST: postgres
      NS_POSTGRES_DATABASE: nightscout_compose_test
      NS_POSTGRES_PASSWORD_FILE: /state/bootstrap/postgres-password
    volumes:
      - ${NS_DEMO_STATE}:/state
      - ${NS_DEMO_STATE}/credentials:/run/ns-credentials:ro
      - ${NS_DEMO_STATE}/tls/ca.crt:/run/ns-ca/ca.crt:ro

  # Operator provisioning is a private network service, never published.
  admin:
    <<: *app
    environment:
      <<: *app-env
      ADMIN_HOSTNAME: admin
      ADMIN_PORT: "1342"
      NS_VAULT_ADDR: https://vault:8200
      ADMIN_INSECURE_BIND_ACKNOWLEDGED: "true"
    command: [node, deploy/multitenant/entrypoint.js, admin]
    restart: ${NS_COMPOSE_RESTART:-on-failure}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      vault: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://admin:1342/v1/openapi.json',{signal:AbortSignal.timeout(1500)}).then(r=>{if(!r.ok)process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ${NS_DEMO_STATE}/admin:/run/ns-config:ro
      - ${NS_DEMO_STATE}/tls/ca.crt:/run/ns-ca/ca.crt:ro

  primer:
    <<: *app
    profiles: [ops]
    command: [node, deploy/multitenant/prime.js, provision]
    depends_on:
      admin: {condition: service_healthy}
    environment:
      NS_PRIMER_STATE: /run/ns-primer
      NS_DEMO_TENANTS: ${NS_DEMO_TENANTS:-2}
    volumes:
      - ${NS_DEMO_STATE}/primer:/run/ns-primer

  # Start order: every role waits for the one-shot bootstrap to complete and for the stores it
  # uses, then the roles start together. Realtime retries a not-ready api within
  # NS_TENANT_WARM_RETRY_MS; the evaluator's wake to realtime is best effort and realtime
  # reconciles. nginx waits for the roles it
  # serves (api, realtime, ui) only, so an unhealthy evaluator or tenant-admin never keeps the
  # site down.
  api:
    <<: *app
    environment:
      <<: *serving-env
      NS_SERVE_INTERNAL_SOCKET: /run/ns-ipc/api.sock
      API_HOSTNAME: 0.0.0.0
      API_PORT: "1337"
      NS_VAULT_ADDR: https://vault:8200
      NS_API_REST_CONCURRENCY: ${NS_API_REST_CONCURRENCY:-}
      NS_API_REST_QUEUE: ${NS_API_REST_QUEUE:-}
      NS_API_REST_QUEUE_TIMEOUT_MS: ${NS_API_REST_QUEUE_TIMEOUT_MS:-}
      NS_API_REST_RETRY_AFTER_SECONDS: ${NS_API_REST_RETRY_AFTER_SECONDS:-}
    command: [node, deploy/multitenant/entrypoint.js, api]
    restart: ${NS_COMPOSE_RESTART:-on-failure}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      vault: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, bin/nightscout.js, healthcheck, --endpoint, ready, --socket, /run/ns-ipc/api.sock]
      interval: 2s
      timeout: 2s
      retries: 30
      # Tenant startup grows with the tenant count (decision readiness-serve-then-warm;
      # 1,000 tenants took 341-421 s with every tenant warmed before ready).
      start_period: 900s
      start_interval: 2s
    volumes:
      - ${NS_DEMO_STATE}/api:/run/ns-config:ro
      - ${NS_DEMO_STATE}/ipc:/run/ns-ipc
      - ${NS_DEMO_STATE}/tls/ca.crt:/run/ns-ca/ca.crt:ro

  realtime:
    <<: *app
    environment:
      <<: *serving-env
      NS_SERVE_INTERNAL_SOCKET: /run/ns-ipc/realtime.sock
      REALTIME_HOSTNAME: 0.0.0.0
      REALTIME_PORT: "1339"
    command: [node, deploy/multitenant/entrypoint.js, realtime]
    restart: ${NS_COMPOSE_RESTART:-on-failure}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, bin/nightscout.js, healthcheck, --endpoint, ready, --socket, /run/ns-ipc/realtime.sock]
      interval: 2s
      timeout: 2s
      retries: 30
      # Tenant startup grows with the tenant count (decision readiness-serve-then-warm;
      # 1,000 tenants took 341-421 s with every tenant warmed before ready).
      start_period: 900s
      start_interval: 2s
    volumes:
      - ${NS_DEMO_STATE}/realtime:/run/ns-config:ro
      - ${NS_DEMO_STATE}/ipc:/run/ns-ipc
      - ${NS_DEMO_STATE}/tls/ca.crt:/run/ns-ca/ca.crt:ro

  evaluator:
    <<: *app
    environment:
      <<: *serving-env
      NS_SERVE_INTERNAL_SOCKET: /run/ns-ipc/evaluator.sock
    command: [node, deploy/multitenant/entrypoint.js, evaluator]
    restart: ${NS_COMPOSE_RESTART:-on-failure}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, bin/nightscout.js, healthcheck, --endpoint, ready, --socket, /run/ns-ipc/evaluator.sock]
      interval: 2s
      timeout: 3s
      retries: 30
      # Tenant startup grows with the tenant count (decision readiness-serve-then-warm;
      # 1,000 tenants took 341-421 s with every tenant warmed before ready).
      start_period: 900s
      start_interval: 2s
    volumes:
      - ${NS_DEMO_STATE}/evaluator:/run/ns-config:ro
      - ${NS_DEMO_STATE}/ipc:/run/ns-ipc
      - ${NS_DEMO_STATE}/tls/ca.crt:/run/ns-ca/ca.crt:ro

  tenant-admin:
    <<: *app
    environment:
      <<: *serving-env
      NS_SERVE_INTERNAL_SOCKET: /run/ns-ipc/tenant-admin.sock
      TENANT_ADMIN_HOSTNAME: 0.0.0.0
      TENANT_ADMIN_PORT: "1341"
      NS_VAULT_ADDR: https://vault:8200
    command: [node, deploy/multitenant/entrypoint.js, tenant-admin]
    restart: ${NS_COMPOSE_RESTART:-on-failure}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      vault: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, bin/nightscout.js, healthcheck, --endpoint, ready, --socket, /run/ns-ipc/tenant-admin.sock]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ${NS_DEMO_STATE}/tenant-admin:/run/ns-config:ro
      - ${NS_DEMO_STATE}/ipc:/run/ns-ipc
      - ${NS_DEMO_STATE}/tls/ca.crt:/run/ns-ca/ca.crt:ro

  ui:
    <<: *app
    command: [node, -r, ./deploy/multitenant/load-env.js, deploy/multitenant/ui.js]
    restart: ${NS_COMPOSE_RESTART:-on-failure}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    environment:
      UI_HOSTNAME: 0.0.0.0
      UI_PORT: "1340"
      UI_PUBLIC_CONFIG: /run/ns-config/config.json
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:1340/healthz',{signal:AbortSignal.timeout(1500)}).then(async r=>{if(!r.ok||await r.text()!=='ok\\n')process.exitCode=1}).catch(()=>{process.exitCode=1})"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ${NS_DEMO_STATE}/ui:/run/ns-config:ro

  nginx:
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      api: {condition: service_healthy}
      realtime: {condition: service_healthy}
      ui: {condition: service_healthy}
    ports:
      - ${NS_DEMO_BIND:-127.0.0.1}:${NS_DEMO_PORT:-18080}:8080
    volumes:
      - ${NS_DEMO_STATE}/edge/nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [backend, edge]

  demo:
    <<: *app
    profiles: [ops]
    command: [node, -r, ./deploy/multitenant/load-env.js, deploy/multitenant/demo.js]
    environment:
      NODE_EXTRA_CA_CERTS: /run/ns-ca/ca.crt
      NS_DEMO_CONFIRM_SYNTHETIC: "1"
    volumes:
      - ${NS_DEMO_STATE}/ops:/run/ns-config:ro
      - ${NS_DEMO_STATE}/ipc:/run/ns-ipc
      - ${NS_DEMO_STATE}/artifacts:/run/ns-artifacts
      - ${NS_DEMO_STATE}/tls/ca.crt:/run/ns-ca/ca.crt:ro

networks:
  backend:
    internal: true
  edge:
    driver: bridge
    internal: false

volumes:
  postgres-data:
  vault-data:
  vault-logs:
