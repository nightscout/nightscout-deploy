apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: provision
    app.kubernetes.io/name: nightscout
    app.kubernetes.io/part-of: nightscout-multitenant
  name: provision
  namespace: nightscout-preview
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/component: provision
        app.kubernetes.io/name: nightscout
        app.kubernetes.io/part-of: nightscout-multitenant
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - -e
        - const fs=require('node:fs');for(const f of ['bootstrap/complete.json','vault-agent/complete.json','ownership-admin/complete.json'])if(!fs.existsSync('/state/'+f))process.exit(1);process.stdout.write(JSON.stringify({state:'provisioned'})+'\n')
        env:
        - name: NODE_EXTRA_CA_CERTS
          value: /run/ns-ca/ca.crt
        - name: VAULT_ADDR
          value: https://vault:8200
        - name: NS_BOOTSTRAP_OUTPUT
          value: /state
        image: nightscout-multitenant-demo:16a1fc2d45e59602eb6ec3e3bf6f506f35bcc5b1
        imagePullPolicy: IfNotPresent
        name: done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /state
          name: state
        - mountPath: /run/secrets
          name: postgres-password
          readOnly: true
        - mountPath: /run/ns-ca
          name: ns-ca
          readOnly: true
        - mountPath: /run/ns-overlay
          name: scripts
          readOnly: true
        - mountPath: /run/ns-overlay-ownership
          name: ownership-grants
          readOnly: true
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      initContainers:
      - command:
        - node
        - -e
        - |
          const net=require('node:net');
          const up=(host,port)=>new Promise(r=>{const s=net.connect({host,port});s.setTimeout(1500);s.once('connect',()=>{s.end();r(true)});s.once('timeout',()=>{s.destroy();r(false)});s.once('error',()=>r(false));});
          (async()=>{for(let i=0;i<120;i++){if(await up('postgres',5432)&&await up('vault',8200))return;await new Promise(r=>setTimeout(r,2000));}process.exit(1);})();
