apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: admin
    app.kubernetes.io/name: nightscout
    app.kubernetes.io/part-of: nightscout-multitenant
  name: admin
  namespace: nightscout-preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: admin
      app.kubernetes.io/name: nightscout
      app.kubernetes.io/part-of: nightscout-multitenant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: admin
        app.kubernetes.io/name: nightscout
        app.kubernetes.io/part-of: nightscout-multitenant
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - -e
        - require('/opt/app/deploy/multitenant/load-env');require('/opt/app/lib/cli').main(['multitenant','admin'])
        env:
        - name: ADMIN_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
