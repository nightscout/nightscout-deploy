---
apiVersion: v1
data:
  demo.hcl: |
    disable_mlock = true
    ui = false
    api_addr = "https://vault:8200"
    storage "file" { path = "/vault/file" }
    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_cert_file = "/run/ns-tls/server.crt"
      tls_key_file = "/run/ns-tls/server.key"
    }
